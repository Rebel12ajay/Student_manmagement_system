{% extends "base.html" %}
{% block title %}Edit Student | StudentHub{% endblock %}
{% block content %}
<div class="card">
  <h1>Edit Student</h1><p class="muted">Update the information and save your changes.</p>
  <form action="/edit/{{ student[0] }}" method="POST">
    <div class="form-grid">
      <div class="field"><label>Full Name</label><input type="text" name="name" value="{{ student[1] }}" required></div>
      <div class="field"><label>Email Address</label><input type="email" name="email" value="{{ student[2] }}" required></div>
      <div class="field"><label>Course</label><input type="text" name="course" value="{{ student[3] }}" required></div>
      <div class="field"><label>Age</label><input type="number" name="age" value="{{ student[4] }}" min="1" max="100" required></div>
    </div>
    <div class="form-actions"><button class="btn btn-blue" type="submit">Save Changes</button><a class="btn btn-light" href="/students">Cancel</a></div>
  </form>
</div>
{% endblock %}
