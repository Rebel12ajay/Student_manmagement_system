{% extends "base.html" %}
{% block title %}Add Student | StudentHub{% endblock %}
{% block content %}
<div class="card">
  <h1>Add New Student</h1><p class="muted">Enter the student's details below.</p>
  <form action="/add" method="POST">
    <div class="form-grid">
      <div class="field"><label>Full Name</label><input type="text" name="name" placeholder="Enter name" required></div>
      <div class="field"><label>Email Address</label><input type="email" name="email" placeholder="student@example.com" required></div>
      <div class="field"><label>Course</label><input type="text" name="course" placeholder="e.g. CSE" required></div>
      <div class="field"><label>Age</label><input type="number" name="age" min="1" max="100" placeholder="Enter age" required></div>
    </div>
    <div class="form-actions"><button class="btn btn-blue" type="submit">Add Student</button><a class="btn btn-light" href="/students">Cancel</a></div>
  </form>
</div>
{% endblock %}
